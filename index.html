<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

    <header>
        <h1>Employee Management</h1>
        <p>Manage your employees in one place</p>
    </header>

    <main class="dashboard">

        <section class="form-section">

            <h2>Employee Information</h2>

            <form id="employeeForm" onsubmit="event.preventDefault(); onFormSubmit();"
                autocomplete="off">

                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName"
                        placeholder="Enter full name">
                    <span class="validation-error hide"
                        id="fullNameValidationError">
                        Full Name is required!
                    </span>
                </div>

                <div class="form-group">
                    <label for="empCode">Employee Code</label>
                    <input type="text" id="empCode"
                        placeholder="Enter employee code">
                </div>

                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input type="number" id="salary"
                        placeholder="Enter salary" min="0">
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city"
                        placeholder="Enter city">
                </div>

                <div class="form-buttons">
                    <button type="submit" id="submitBtn">
                        Add Employee
                    </button>

                    <button type="reset" class="reset-btn">
                        Clear
                    </button>
                </div>

            </form>
        </section>

       
        <section class="table-section">

            <h2>Employee List</h2>

            <div class="table-container">
                <table id="employeeList">

                    <thead>
                        <tr>
                            <th>Full Name</th>
                            <th>EMP Code</th>
                            <th>Salary</th>
                            <th>City</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                    </tbody>

                </table>
            </div>

            <p class="empty-message" id="emptyMessage">
                No employees added yet.
            </p>

        </section>

    </main>

    <footer>
        <p>Employee Management System | Created with HTML, CSS & JavaScript</p>
    </footer>

</div>

<script src="script.js"></script>
</body>
</html>
